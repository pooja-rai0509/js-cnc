<!DOCTYPE html>
<html lang="en">

<body style="background-color: #212121; color: aliceblue;">
    <button id="card">Make Card</button>
    <div id="main"></div>
    <!-- 0	UNSENT	Client has been created. open() not called yet.
    1	OPENED	open() has been called.
    2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
    3	LOADING	Downloading; responseText holds partial data.
    4	DONE	The operation is complete. -->
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    //const xhr = new XMLHttpRequest()
    //xhr.open('GET',requestUrl)
    // xhr.onreadystatechange = function (){
    //     //console.log(xhr.readyState);
    //     if(xhr.readyState === 4){
    //         const data = JSON.parse(this.responseText)
    //         console.log(this.responseText)
    //         console.log(typeof data);
    //     }
    // }
    //xhr.send()
    // photo, follower & make a card on click of a button

    document.getElementById('card').addEventListener('click',(requestUrl) => {
        const main = document.getElementById('main')
        const profile = document.createElement('div')
        profile.style.padding='10px 0px 0px 0px'
        const follower = document.createElement('h2')

        const xhr = new XMLHttpRequest()
        xhr.open('GET','https://api.github.com/users/hiteshchoudhary')
        xhr.onreadystatechange = function () {
            //console.log(xhr.readyState);
            if (xhr.readyState === 4) {
                const data = JSON.parse(this.responseText) //string to json
                console.log(this.responseText)
                console.log(typeof data);

                profile.innerHTML = `<img src=${data.avatar_url} />`
                follower.innerHTML = `Followers: ${data.followers}`
            }
        }
        xhr.send()
        main.appendChild(profile)
        main.appendChild(follower)
        
    })
</script>
</html>
