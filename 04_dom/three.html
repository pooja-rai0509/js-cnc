<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crete Elements in DOM</title>
</head>
<body style="background-color: #212121; color: white;">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title", "generate title") // most preferrable
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // two types we can add text in a div
    //div.innerText = "Example" 
    const addText = document.createTextNode("Example")
    div.append(addText)

    document.body.appendChild(div)  // in body the divc will appear
</script>
</html>
