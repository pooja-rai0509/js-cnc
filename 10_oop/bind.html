<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React(Bind)</title>
</head>
<body>
    <button>Button Clicked</button>
</body>
<script>
    class React {
        constructor(){
            this.library = "ReactLib"
            this.server = "https://localhost:3000"

            // requirement - on click of button any even happen
            document.querySelector('button').addEventListener('click',this.handleClick.bind(this))
            // to bind all this variables on any event
        }

        handleClick(){
            console.log("Button Clicked");
            console.log(this.server);
            
        }
    }

    const app = new React()
</script>
</html>
