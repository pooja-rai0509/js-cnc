    //  When clicked on any image then that image to be removed/hide
    document.querySelector('#images').addEventListener('click',function(e){
        console.log(e.target.parentNode);
        console.log(e.target.tagName);
        if(e.target.tagName === 'IMG'){     // FOR NOT TO REMOVE WHOLE UL WHEN LI SELECTED
            let removeIt = e.target.parentNode
            removeIt.remove() //direct remove that li
            //removeIt.parentNode.removeChild(removeIt) //selected li's ul to remove its selected child
